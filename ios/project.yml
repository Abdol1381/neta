name: SIMBridge
options:
  bundleIdPrefix: app.simbridge
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  # SIP / VoIP engine (no-video flavour of the Linphone SDK)
  linphonesw:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-ios.git
    branch: novideo/stable
targets:
  SIMBridge:
    type: application
    platform: iOS
    sources:
      - path: SIMBridge
    dependencies:
      - package: linphonesw
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.simbridge.ios
        PRODUCT_NAME: SIMBridge
        INFOPLIST_FILE: SIMBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
