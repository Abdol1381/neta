name: SIMBridge
options:
  bundleIdPrefix: app.simbridge
  deploymentTarget:
    iOS: "16.2"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  # SIP / VoIP engine (no-video flavour of the Linphone SDK)
  linphonesw:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-ios.git
    branch: novideo/stable
targets:
  SIMBridge:
    type: application
    platform: iOS
    sources:
      - path: SIMBridge
      - path: Shared
    dependencies:
      - package: linphonesw
      - target: SIMBridgeWidget
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.simbridge.ios
        PRODUCT_NAME: SIMBridge
        INFOPLIST_FILE: SIMBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: SIMBridge/Core/ObjCTry.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
  # Live Activity: the Android SIM's signal on the Lock Screen and in the Dynamic Island.
  SIMBridgeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: SIMBridgeWidget
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.simbridge.ios.signal
        PRODUCT_NAME: SIMBridgeWidget
        INFOPLIST_FILE: SIMBridgeWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
