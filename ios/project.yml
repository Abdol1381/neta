name: SIMBridge
options:
  bundleIdPrefix: app.simbridge
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fa
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  SIMBridge:
    type: application
    platform: iOS
    sources:
      - path: SIMBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.simbridge.ios
        PRODUCT_NAME: SIMBridge
        INFOPLIST_FILE: SIMBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
