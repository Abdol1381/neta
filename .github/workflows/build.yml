name: Build & test apps

on:
  push:
    branches: [main, "test/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen || (curl -sSL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip && unzip -q /tmp/xg.zip -d /tmp/xg && sudo cp /tmp/xg/xcodegen/bin/xcodegen /usr/local/bin/ && sudo mkdir -p /usr/local/share/xcodegen && sudo cp -R /tmp/xg/xcodegen/share/xcodegen/* /usr/local/share/xcodegen/)
          xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project SIMBridge.xcodeproj -target SIMBridge \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|warning:" build.log | sort -u | head -80 || true
          if ! grep -q "\*\* BUILD SUCCEEDED \*\*" build.log; then
            grep -E "error:" build.log | sort -u | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-ios
          path: ios/build.log
          if-no-files-found: ignore

      - name: Package IPA
        working-directory: ios
        run: |
          APP="build/Release-iphoneos/SIMBridge.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry SIMBridge-unsigned.ipa Payload
          ls -la SIMBridge-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SIMBridge-iOS
          path: ios/SIMBridge-unsigned.ipa

  ios-ui:
    name: iOS Simulator UI test
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install websockets==13.1 cryptography
          brew install xcodegen || (curl -sSL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip && unzip -q /tmp/xg.zip -d /tmp/xg && sudo cp /tmp/xg/xcodegen/bin/xcodegen /usr/local/bin/ && sudo mkdir -p /usr/local/share/xcodegen && sudo cp -R /tmp/xg/xcodegen/share/xcodegen/* /usr/local/share/xcodegen/)
      - name: Run UI test
        run: bash tools/ios_ui.sh "$GITHUB_WORKSPACE/ios-ui-out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ios-ui
          path: ios-ui-out
          if-no-files-found: ignore

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional secrets)
        env:
          KEYSTORE_B64: ${{ secrets.SIMBRIDGE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIMBRIDGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        working-directory: android
        env:
          SIMBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.SIMBRIDGE_KEYSTORE_PASSWORD }}
          SIMBRIDGE_KEY_ALIAS: ${{ secrets.SIMBRIDGE_KEY_ALIAS }}
          SIMBRIDGE_KEY_PASSWORD: ${{ secrets.SIMBRIDGE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" assembleRelease assembleDebug lintRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "^e: |error:|Error:" build.log | sort -u | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
            exit $status
          fi
          grep -E "^w: " build.log | sort -u | head -40 || true
          cp app/build/outputs/apk/release/app-release.apk SIMBridge-android.apk
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          mkdir -p lint && cp app/build/reports/lint-results-release.* lint/ 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-android
          path: |
            android/build.log
            android/lint
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: SIMBridge-Android
          path: android/SIMBridge-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app-debug.apk

  android-e2e:
    name: Android E2E (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: apk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client cryptography
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash -c "set -o pipefail; mkdir -p e2e-out-${{ matrix.api }}; python -u tools/android_e2e.py --apk apk/app-debug.apk --out e2e-out-${{ matrix.api }} 2>&1 | tee e2e-out-${{ matrix.api }}/console.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-android-${{ matrix.api }}
          path: e2e-out-${{ matrix.api }}
          if-no-files-found: ignore

  report:
    name: Write ci-status branch
    needs: [ios, ios-ui, android, android-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: logs
      - uses: actions/download-artifact@v4
        with:
          pattern: test-*
          path: tests
      - name: Commit status summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install pillow >/dev/null 2>&1 || true
          mkdir out
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_RUN_NUMBER}"
            echo "ios: ${{ needs.ios.result }}"
            echo "ios-ui: ${{ needs.ios-ui.result }}"
            echo "android: ${{ needs.android.result }}"
            echo "android-e2e: ${{ needs.android-e2e.result }}"
          } > out/STATUS.txt
          f=logs/log-ios/build.log
          if [ -f "$f" ]; then grep -nE "error:|warning:" "$f" | sort -u -t: -k3 | head -150 > out/errors-ios.txt || true; fi
          f=logs/log-android/build.log
          if [ -f "$f" ]; then grep -nE "^e: |^w: |error:|FAILED|What went wrong" "$f" | head -150 > out/errors-android.txt || true; fi
          cp logs/log-android/lint/*.txt out/ 2>/dev/null || true
          gh run view ${{ github.run_id }} -R ${{ github.repository }} --log-failed 2>&1 | tail -n 400 > out/failed-steps.txt || true
          if [ -d tests ]; then cp -r tests out/; fi
          python3 - <<'PY' || true
          import glob
          from PIL import Image
          for p in glob.glob("out/tests/**/*.png", recursive=True):
              im = Image.open(p)
              if im.height > 1300:
                  im.thumbnail((1300, 1300))
                  im.save(p, optimize=True)
          PY
          cd out
          git init -q -b ci-status
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "CI status for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-status

  release:
    name: Publish release
    needs: [ios, android]
    # Publish whatever built successfully (Android alone is enough); tests are reported separately.
    if: always() && github.ref == 'refs/heads/main' && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SIMBridge-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SIMBridge build ${{ github.run_number }}
          make_latest: true
          body: |
            - **SIMBridge-unsigned.ipa** — iPhone app. Install with Sideloadly / AltStore (signed with your Apple ID).
            - **SIMBridge-android.apk** — Android agent for the phone that holds the SIM card.
          fail_on_unmatched_files: false
          files: |
            dist/SIMBridge-unsigned.ipa
            dist/SIMBridge-android.apk
